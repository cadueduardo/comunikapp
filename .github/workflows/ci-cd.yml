name: CI/CD Pipeline - Orçamento → OS → PCP

on:
  push:
    # `feat/*` além de `feature/*`: a convenção usada no repositório é `feat/`,
    # então as branches de trabalho nunca disparavam o pipeline.
    branches: [main, develop, feature/*, feat/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  MYSQL_VERSION: '8.0'
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_test
  ESTOQUE_DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_test
  JWT_SECRET: ci-jwt-secret-minimo-32-caracteres-ok
  JWT_EXPIRES_IN: 7d
  NODE_ENV: test
  PORT: '4000'
  HOST: 127.0.0.1
  FRONTEND_URL: http://localhost:3000
  ESTOQUE_INTERNAL_API_TOKEN: ci-estoque-internal-token-min-32-chars
  # O bootstrap recusa subir sem um segredo administrativo próprio, distinto do
  # JWT de loja. Sem isto o job de OpenAPI nunca conseguia iniciar a aplicação.
  ADMIN_JWT_SECRET: ci-admin-jwt-secret-distinto-minimo-32-chars
  # A suíte é grande o bastante para estourar o heap padrão do Node no runner,
  # o que aparecia como `exit code 134` sem nenhuma falha de asserção.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  npm-audit-baseline:
    name: npm audit vs baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Testes do comparador de baseline
        run: node scripts/security/compare-npm-audit-baseline.test.js

      - name: Instalar dependências (backend)
        working-directory: backend
        run: npm ci

      - name: Instalar dependências (frontend)
        working-directory: frontend
        run: npm ci

      - name: Smoke sharp (backend)
        working-directory: backend
        run: node scripts/smoke-sharp-upload.mjs

      - name: npm audit backend (--omit=dev) vs baseline
        working-directory: backend
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-backend.json
          set -e
          node ../scripts/security/compare-npm-audit-baseline.js \
            --scope backend \
            --audit /tmp/audit-backend.json \
            --baseline ../scripts/security/npm-audit-baseline.json

      - name: npm audit frontend (--omit=dev) vs baseline
        working-directory: frontend
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/audit-frontend.json
          set -e
          node ../scripts/security/compare-npm-audit-baseline.js \
            --scope frontend \
            --audit /tmp/audit-frontend.json \
            --baseline ../scripts/security/npm-audit-baseline.json

  lint-and-format:
    name: Lint e Formatação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Verificar formatação
        working-directory: backend
        run: npm run format -- --check

      - name: Compilar backend (typecheck)
        working-directory: backend
        run: npm run build

  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: comunikapp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Sincronizar schema no banco de teste
        working-directory: backend
        run: npx prisma db push --accept-data-loss

      - name: Executar testes unitários
        working-directory: backend
        run: npm run test -- --coverage --silent --passWithNoTests

  e2e-tests:
    name: Testes End-to-End
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: comunikapp_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_e2e
      ESTOQUE_DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_e2e

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Sincronizar schema no banco E2E
        working-directory: backend
        run: npx prisma db push --accept-data-loss

      - name: Executar testes E2E
        working-directory: backend
        run: npm run test:e2e -- --passWithNoTests

  prisma-validation:
    name: Validação Prisma
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Validar schema Prisma
        working-directory: backend
        run: npx prisma validate

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate

  # Gate 0S / HS-04 e HS-05. Os demais jobs usam `prisma db push`, que sincroniza
  # o schema sem nunca executar um arquivo de migration — ou seja, o SQL do HS-04
  # não era exercitado em MySQL 8 por nenhum job existente. Este job aplica a
  # migration de verdade e roda contra ela os testes de isolamento multi-tenant,
  # de código de aprovação e de aceite concorrente.
  #
  # O estado pré-migration é montado por script porque o histórico de migrations
  # do repositório não roda do zero (ver §2.8 de
  # docs/modulo-vendas/fase-0/09-gate-hotfix-seguranca.md).
  gate0s-mysql8:
    name: Gate 0S — migration e testes em MySQL 8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: comunikapp_gate0s
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_gate0s
      ESTOQUE_DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_gate0s
      GATE0S_BANCO_PERMITIDO: comunikapp_gate0s

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Registrar engine e versão do banco
        run: mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION(), @@version_comment;"

      - name: Materializar o schema
        working-directory: backend
        run: npx prisma db push --accept-data-loss

      - name: Voltar ao estado anterior à migration do HS-04
        working-directory: backend
        run: npx ts-node scripts/preparar-estado-pre-migration-hs04.ts

      - name: Aplicar a migration do HS-04
        run: |
          mysql -h 127.0.0.1 -uroot -proot comunikapp_gate0s \
            < backend/prisma/migrations/20260731143000_orcamento_codigo_aprovacao_seguro/migration.sql

      - name: Verificar o efeito estrutural da migration
        working-directory: backend
        run: npx ts-node scripts/verificar-migration-hs04.ts

      # O `db push` acima já materializa o índice único do HS-05, então ele
      # existiria sem que a migration fosse exercitada. Aqui o estado anterior é
      # recriado de propósito para que o SQL rode de verdade em MySQL 8 — o
      # ponto de risco é o `DROP INDEX` sobre coluna de foreign key, que falha
      # se o índice único não estiver no lugar antes.
      - name: Voltar ao estado anterior à migration do índice único da OS
        run: |
          mysql -h 127.0.0.1 -uroot -proot comunikapp_gate0s -e "
            CREATE INDEX \`ordens_servico_orcamento_id_idx\` ON \`ordens_servico\`(\`orcamento_id\`);
            DROP INDEX \`ordens_servico_orcamento_id_key\` ON \`ordens_servico\`;
          "

      - name: Aplicar a migration do índice único da OS
        run: |
          mysql -h 127.0.0.1 -uroot -proot comunikapp_gate0s \
            < backend/prisma/migrations/20260731220000_os_orcamento_id_unico/migration.sql

      - name: HS-04 — código de aprovação em banco real
        working-directory: backend
        run: npx ts-node scripts/validar-codigo-aprovacao-mysql.ts

      - name: HS-01 e HS-02 — isolamento entre dois tenants
        working-directory: backend
        run: npx ts-node scripts/validar-cross-tenant-mysql.ts

      - name: HS-05 — aceite atômico, idempotente e concorrente
        working-directory: backend
        run: npx ts-node scripts/validar-aceite-hs05-mysql.ts

  release-artifact:
    name: Artefato de release imutável
    runs-on: ubuntu-latest
    needs: [npm-audit-baseline, lint-and-format, unit-tests, gate0s-mysql8]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependências (backend)
        working-directory: backend
        run: npm ci

      - name: Instalar dependências (frontend)
        working-directory: frontend
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Build do backend
        working-directory: backend
        run: npm run build

      - name: Build standalone do frontend
        working-directory: frontend
        run: npm run build

      - name: Reduzir dependências do backend
        working-directory: backend
        run: npm prune --omit=dev

      - name: Empacotar release
        run: bash scripts/release/pack-release-artifact.sh --sha "${{ github.sha }}"

      - name: Verificar release
        run: >-
          bash scripts/release/verify-release-artifact.sh
          --artifact "artifacts/release/comunikapp-release-${{ github.sha }}.tar.gz"
          --expected-sha "${{ github.sha }}"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: comunikapp-release-${{ github.sha }}
          path: artifacts/release/
          retention-days: 14

  generate-openapi:
    name: Gerar OpenAPI
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: comunikapp_openapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_openapi
      ESTOQUE_DATABASE_URL: mysql://root:root@127.0.0.1:3306/comunikapp_openapi
      ENABLE_SWAGGER: 'true'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Gerar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Sincronizar schema no banco OpenAPI
        working-directory: backend
        run: npx prisma db push --accept-data-loss

      - name: Build da aplicação
        working-directory: backend
        run: npm run build

      - name: Gerar documentação OpenAPI
        working-directory: backend
        env:
          NODE_ENV: production
        run: |
          npm run start:prod &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4000/api/docs-json" -o ../openapi.json; then
              kill "$APP_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          kill "$APP_PID" 2>/dev/null || true
          echo "Falha ao obter OpenAPI em http://127.0.0.1:4000/api/docs-json"
          exit 1

      - name: Validar OpenAPI
        run: |
          test -s openapi.json
          node -e "const d=require('./openapi.json'); if(!d.openapi||!d.paths) { console.error('openapi.json invalido'); process.exit(1); } console.log('OpenAPI OK:', d.openapi, 'rotas:', Object.keys(d.paths).length);"

      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

  build-and-deploy:
    name: Build e Deploy
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        unit-tests,
        e2e-tests,
        prisma-validation,
        generate-openapi,
      ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Build da aplicação
        working-directory: backend
        run: npm run build

      - name: Executar testes finais
        working-directory: backend
        run: npm run test -- --silent --passWithNoTests

      - name: Deploy para produção
        run: echo "Deploy para produção seria executado aqui"

  notify:
    name: Notificações
    runs-on: ubuntu-latest
    needs:
      [
        npm-audit-baseline,
        lint-and-format,
        unit-tests,
        e2e-tests,
        prisma-validation,
        generate-openapi,
        gate0s-mysql8,
        release-artifact,
        build-and-deploy,
      ]
    if: always()

    steps:
      - name: Resumo do pipeline
        run: |
          echo "npm-audit-baseline: ${{ needs.npm-audit-baseline.result }}"
          echo "lint-and-format: ${{ needs.lint-and-format.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "prisma-validation: ${{ needs.prisma-validation.result }}"
          echo "generate-openapi: ${{ needs.generate-openapi.result }}"
          echo "gate0s-mysql8: ${{ needs.gate0s-mysql8.result }}"
          echo "release-artifact: ${{ needs.release-artifact.result }}"
          echo "build-and-deploy: ${{ needs.build-and-deploy.result }}"

      - name: Falhar se algum job obrigatório quebrou
        if: >-
          needs.npm-audit-baseline.result == 'failure' ||
          needs.lint-and-format.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure' ||
          needs.prisma-validation.result == 'failure' ||
          needs.generate-openapi.result == 'failure' ||
          needs.gate0s-mysql8.result == 'failure' ||
          needs.release-artifact.result == 'failure' ||
          (github.ref == 'refs/heads/main' && needs.build-and-deploy.result == 'failure')
        run: exit 1
