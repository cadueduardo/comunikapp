# Locations compartilhadas: apex/wildcard + hosts custom (Cloudflare for SaaS fallback).
# Incluído por comunikapp.com.br.conf (não usar sozinho).

client_max_body_size 10M;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer always;

location = /api/lojas/login {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://127.0.0.1:4001/lojas/login;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/lojas/login/2fa {
    limit_req zone=login_limit burst=5 nodelay;
    proxy_pass http://127.0.0.1:4001/lojas/login/2fa;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/docs {
    return 404;
}

location /test- {
    return 404;
}

location /debug-logs {
    return 404;
}

location /debug {
    return 404;
}

# BFF Next: cookie HttpOnly de sessão (login/logout/me).
location /api/auth/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# BFF Next da Gestão ComunikApp (cookie administrativo separado).
location /api/gestao/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Demais /api/* same-origin: BFF Next (cookie HttpOnly → Bearer no Nest).
# Sem isto, /api/estoque|/os|/arte-aprovacao|... iam ao Nest sem cookie e quebravam
# após a migração de sessão HttpOnly (commits 79bcf3d9 / 77655faa / 684abbd8).
# Login continua nos location = /api/lojas/login* acima (Nest direto).
# API pública api.comunikapp.com.br permanece no server block próprio → Nest.
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 25M;
}

location /socket.io/ {
    proxy_pass http://127.0.0.1:4001/socket.io/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}

location /uploads/ {
    alias /srv/apps/comunikapp/shared/uploads/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

location /uploads/arte/ {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
