# api-uat.comunikapp.com.br -> NestJS UAT em 127.0.0.1:4011

server {
    listen 80;
    listen [::]:80;
    server_name api-uat.comunikapp.com.br;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-uat.comunikapp.com.br;

    ssl_certificate     /etc/ssl/cloudflare/comunikapp.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/comunikapp.com.br.key;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    location /api/docs { return 404; }
    location /test- { return 404; }
    location /debug { return 404; }
    location /uploads/arte/ { return 404; }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods'     'GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Content-Type, Accept, Authorization, x-loja-id, x-user-roles, x-tenant-slug, x-internal-token, Cache-Control, Pragma' always;
            add_header 'Access-Control-Expose-Headers'    'Content-Length' always;
            add_header 'Access-Control-Max-Age'           86400 always;
            add_header 'Content-Length'                   0 always;
            add_header 'Content-Type'                     'text/plain charset=UTF-8' always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header 'Access-Control-Allow-Origin'      $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods'     'GET, HEAD, PUT, PATCH, POST, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'     'Content-Type, Accept, Authorization, x-loja-id, x-user-roles, x-tenant-slug, x-internal-token, Cache-Control, Pragma' always;
        add_header 'Access-Control-Expose-Headers'    'Content-Length' always;

        proxy_pass         http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
