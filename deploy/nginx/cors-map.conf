# =============================================================================
# CORS map - deve ficar DENTRO de `http { }` do nginx.conf
# =============================================================================
# Lê o header Origin do request e reflete na resposta APENAS se a origem for permitida.
# (Nunca enviar "*" porque usamos credenciais.)
#
# Instalação:
#   sudo cp /opt/comunikapp/app/deploy/nginx/cors-map.conf /etc/nginx/conf.d/cors-map.conf
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

map $http_origin $cors_origin {
    default                              "";
    "https://comunikapp.com.br"          "https://comunikapp.com.br";
    "https://www.comunikapp.com.br"      "https://www.comunikapp.com.br";
    # Fatia B: qualquer slug de loja (não cobre api./ssh. — hosts separados).
    "~^https://[a-z0-9-]+\.comunikapp\.com\.br$"  $http_origin;
    # Fatia C: domínios próprios verificados NÃO entram aqui automaticamente.
    # Abrir Origin arbitrário com credentials quebraria o modelo de cookie.
    # Quando Cloudflare for SaaS (Custom Hostnames) estiver ativo, incluir
    # origins conhecidos via geração/atualização deste map ou allowlist dinâmica.
}
