# Comunikapp production Nginx site.
# Runtime expected by the current VPS:
# - frontend Next.js: 127.0.0.1:3001
# - backend NestJS/API/Socket.IO: 127.0.0.1:4001
#
# Fatia D: segundo server HTTPS (default) aceita Host de domínio próprio
# encaminhado pelo Cloudflare for SaaS (fallback origin). Middleware Next
# valida o tenant; Origin Cert continua na origem (Full Strict).

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    # Fatia B: mesmo site Next para apex e {slug}.comunikapp.com.br
    # api. e ssh. permanecem em server blocks próprios.
    server_name comunikapp.com.br www.comunikapp.com.br *.comunikapp.com.br;

    include /etc/nginx/snippets/comunikapp-app-proxy.conf;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/ssl/cloudflare/comunikapp.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/comunikapp.com.br.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Catch-all: Custom Hostnames (SaaS) chegam com Host do cliente.
server {
    listen [::]:443 ssl;
    listen 443 ssl default_server;
    server_name _;

    include /etc/nginx/snippets/comunikapp-app-proxy.conf;

    ssl_certificate /etc/ssl/cloudflare/comunikapp.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/comunikapp.com.br.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name comunikapp.com.br www.comunikapp.com.br *.comunikapp.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
