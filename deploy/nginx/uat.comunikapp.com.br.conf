# UAT frontend — nome exato vence o wildcard *.comunikapp.com.br da produção.

server {
    server_name uat.comunikapp.com.br;
    include /etc/nginx/snippets/comunikapp-uat-app-proxy.conf;
    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/ssl/cloudflare/comunikapp.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/comunikapp.com.br.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name uat.comunikapp.com.br;
    return 301 https://$host$request_uri;
}
